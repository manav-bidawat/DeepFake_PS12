name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compile dependency
        run: |
          python -m pip install --upgrade pip

      - name: Static compile check
        run: |
          python -m compileall src webapp tests

      - name: Run lightweight tests
        run: |
          python -m unittest discover -s tests -v
